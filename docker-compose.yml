services:
  ai-service:
    build: ./ai-service
    container_name: supportdesk-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    volumes:
      - ai_data:/app/data

  backend:
    build: ./backend
    container_name: supportdesk-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - ai-service

  frontend:
    build: ./frontend
    container_name: supportdesk-frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  ai_data:
